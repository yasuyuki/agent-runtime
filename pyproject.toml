[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "0.2.0"
description = "Explicit, transparent standard-name agent CLI runtime"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.urls]
Source = "https://github.com/yasuyuki/agent-runtime"

[project.scripts]
agent-handoff-receive = "agent_runtime.handoff:main"
agent-runtime = "agent_runtime.cli:main"
codex = "agent_runtime.cli:codex_main"
claude = "agent_runtime.cli:claude_main"
grok = "agent_runtime.cli:grok_main"

[tool.setuptools.packages.find]
where = ["src"]
