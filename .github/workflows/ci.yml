name: CI
on: [push, pull_request]
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - shell: bash
        run: python -m twine check --strict dist/*
      - name: Install and test outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/agent-runtime-tests"
          if [ "$RUNNER_OS" = Windows ]; then
            runtime="$RUNNER_TEMP/agent-runtime-tests/Scripts"
          else
            runtime="$RUNNER_TEMP/agent-runtime-tests/bin"
          fi
          "$runtime/python" -m pip install --no-index dist/*.whl
          "$runtime/python" -m pip install "workspace-lifecycle @ https://github.com/yasuyuki/workspace-lifecycle/archive/2d6d099db547b6613c266025c93aaf3cbe15066e.zip"
          cd "$RUNNER_TEMP"
          "$runtime/agent-runtime" --version
          "$runtime/agent-handoff-receive" --help
          "$runtime/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
